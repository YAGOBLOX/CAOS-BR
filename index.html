<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CAOS BR</title>
  <meta name="description" content="CAOS BR: jogo multiplayer de tiro 2D com arenas dinâmicas, jogado direto no navegador.">
  <meta property="og:title" content="CAOS BR">
  <meta property="og:description" content="Jogo multiplayer de tiro 2D com arenas dinâmicas, direto no navegador.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #e8ebf2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
    #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 24px; text-align: center;
      background: radial-gradient(circle at 50% 30%, #1b2030, #0b0d12 70%); }
    #menu[hidden], #exit[hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(40px, 10vw, 72px); letter-spacing: 4px; color: #ffb347;
      text-shadow: 0 0 24px rgba(255, 120, 40, 0.45); }
    .sub { margin: 0 0 8px; color: #9aa3b8; max-width: 420px; }
    input[type=text] { width: min(280px, 80vw); padding: 12px 14px; font-size: 16px; border-radius: 10px;
      border: 1px solid #3a4154; background: #151925; color: #fff; text-align: center; }
    button { width: min(280px, 80vw); padding: 14px; font-size: 17px; font-weight: 600; border: 0;
      border-radius: 10px; background: #ff7a2f; color: #1a0e05; cursor: pointer; }
    button.secondary { background: #2a3145; color: #e8ebf2; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #onlineNote { font-size: 13px; color: #8d96ab; min-height: 16px; }
    .help { font-size: 13px; color: #8d96ab; max-width: 420px; line-height: 1.5; }
    #exit { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: auto;
      padding: 6px 14px; font-size: 13px; background: rgba(0,0,0,0.45); color: #ccd; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="exit" class="secondary" hidden>Sair (Esc)</button>

  <div id="menu">
    <h1>CAOS BR</h1>
    <p class="sub">Tiro 2D com arenas dinâmicas. A tempestade fecha, a arena encolhe, sobreviva.</p>
    <input id="name" type="text" maxlength="16" placeholder="Seu nome" autocomplete="off">
    <button id="btnOffline">Jogar offline (contra bots)</button>
    <button id="btnOnline" class="secondary">Jogar online</button>
    <div id="onlineNote"></div>
    <div class="help">
      Computador: <b>WASD</b> move, <b>mouse</b> mira, <b>clique/Espaço</b> atira.<br>
      Celular: joystick esquerdo move, joystick direito mira e atira.
    </div>
  </div>

  <noscript>Ative o JavaScript para jogar CAOS BR.</noscript>
  <script type="module" src="client/main.js"></script>
</body>
</html>
