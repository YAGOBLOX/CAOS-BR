# Configuração opcional para o Render (https://render.com) via "Blueprint".
# Também dá para criar o serviço manualmente; veja o CLAUDE.md.
services:
  - type: web
    name: caos-br-server
    runtime: node
    plan: free
    buildCommand: echo "sem build"
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://yagoblox.github.io
